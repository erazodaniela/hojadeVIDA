name: cv_flutter_wrapper
description: "Aplicación Wrapper en Flutter para embeber la Hoja de Vida Web interactiva mediante WebView y controles nativos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  share_plus: ^10.1.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    - assets/web/assets/
